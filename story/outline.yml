schema: authorbot.story-graph/v1

nodes:
  - id: premise:main
    type: premise
    title: One-sentence premise
    summary: >-
      A workaholic engineer caring for his fading mother discovers that his
      harmless garage project might restore her mind, and in trying to perfect
      it sacrifices first their remaining time together, then the universe
      itself.
    order: 10

  - id: premise:synopsis
    type: premise
    title: Five-sentence synopsis
    parent: premise:main
    summary: >-
      Months into caring for his mother Ruth, controls engineer Evan Hale is
      building a garage-scale MRI flux source with her when a defective
      superconducting ring begins producing measurements that should not
      agree. While testing the anomaly, Evan experiences impossible clarity
      and discovers that the machine can force the improbable to happen,
      turning the project he shares with Ruth into an obsession that steals
      their remaining time together. When Evan exposes Ruth to the machine,
      she becomes lucid and casually asks after the granddaughter who survived
      in Ruth's memories but was miscarried in Evan's history; Evan treats the
      impossible detail as a calibration error rather than confront what the
      machine has selected. Addicted to the machine and haunted by entities
      that prove to be echoes of dying realities, Evan realizes each run is
      erasing entire universes; yet every attempt to stop becomes another
      impossible link in the chain that keeps it operating while Ruth's last
      lucid hours pass without him. As reality collapses around them into a
      fractal singularity, Evan and the one companion improbable enough to
      remain herself attempt to erase his mistake, only for their final act to
      become the genesis of our universe.
    order: 15

