# Machine-readable mirror of accepted structural planning.
# schema: authorbot.story-graph/v1
#
# This graph supersedes the legacy graph.
# It deliberately stays at premise, arc, character, concept, and motif level.
# Detailed chapter planning, especially the exact genesis operation, remains
# late-bound until the final chapter or two has been earned by earlier work.
schema: authorbot.story-graph/v1

nodes:
  - id: premise:main
    type: premise
    title: One-sentence premise
    summary: >-
      A controls engineer caring for his fading mother discovers that his
      harmless garage project might restore her mind, and in trying to perfect
      it sacrifices first their remaining time together, then the universe
      itself.
    order: 10

  - id: premise:synopsis
    type: premise
    title: Five-sentence synopsis
    parent: premise:main
    summary: >-
      Months into caring for his mother Ruth, controls engineer Evan Hale is
      building a garage-scale MRI flux source with her when a defective
      superconducting ring begins producing measurements that should not
      agree. While testing the anomaly, Evan experiences impossible clarity
      and discovers that the machine can force the improbable to happen,
      turning the project he shares with Ruth into an obsession that steals
      their remaining time together. When Evan exposes Ruth to the machine,
      she becomes lucid and casually asks after the granddaughter who survived
      in her memories but was miscarried in his; Evan treats the impossible
      detail as a calibration error rather than confront what the machine has
      selected. Addicted to the machine and haunted by entities that prove to
      be echoes of dying realities, Evan realizes each run is erasing entire
      universes; yet every attempt to stop becomes another impossible link in
      the chain that keeps it operating while Ruth's last lucid hours pass
      without him. As reality collapses around them into a fractal singularity,
      Evan and Esther "Tess" Kertesz, the one person too causally rare to be
      smoothly rewritten, attempt to erase his mistake together, and their
      final independent choices become the genesis of our universe.
    order: 15

  - id: arc:shared-project
    type: arc
    title: The shared project
    parent: premise:main
    summary: >-
      Months into caregiving, Evan and Ruth already share the garage workshop.
      They need a flux-pumping run with enough trapped field to justify their
      longer-term portable-imaging project. Their defective ring falls just
      short and carries an apparently impossible temperature reading. As the
      traveling heat pulse reaches one fixed sector, its diode drops below the
      cold-stage temperature while neighboring probes warm normally. Evan
      assumes an instrumentation fault. Ruth repeatedly notices the notch in
      her assigned data-review work but does not remember its prior
      appearances. A costly custom ring ordered months earlier reaches the
      field target and clears the anomaly. Late that night, Evan reinstalls the
      defective ring and reproduces it. The effect cannot require a real
      violation of thermodynamics.
    order: 20

  - id: arc:impossible-clarity
    type: arc
    title: Impossible clarity
    parent: premise:main
    summary: >-
      Evan proves that the anomaly produces real cognitive clarity and can
      force an improbable but physically valid outcome. The shared project
      becomes the perfect reward for his workaholic response to helplessness.
      When he advances the pulse timing to move the cold notch, clarity gives
      him a better ordinary phase sequence that improves trapped flux and moves
      the notch between installed sensors. During the same state, he solves an
      externally testable motor-control problem by preserving two
      electrical-angle hypotheses through an interval in which the sensor
      cannot distinguish them. Both solutions survive. Evan mistakes the state
      for an epiphany or deep flow and claims the insights as his own. Related
      states recur during later timing work.
      His first deliberate test lets fresh physical randomness choose between
      two safe actions in the live apparatus. Record-only bits remain fair,
      and replayed commands produce no effect. Consequential fresh bits become
      biased, and reversing their action mapping preserves the favored
      physical result. Evan believes he has found new physics and calls Lena to
      examine that claim.
      Ruth has always wandered away or been absent during some work, but Evan
      stops treating those departures as pauses. The project advances without
      her and acquires an urgency of its own.
    order: 30

  - id: arc:selected-mother
    type: arc
    title: The concordance window
    parent: premise:main
    summary: >-
      Ruth becomes lucid but casually remembers a granddaughter who survived
      in her history and was miscarried in Evan's. Evan treats the incompatible
      life as a calibration problem rather than confront what the intervention
      may be removing. Her first exposure is incidental during real project work and
      produces lucidity without the incompatible memory. She requests repeat
      runs, and the team initially supports them. Each interval restores more
      continuity and lasts longer, but the gain fades. The alternate
      granddaughter emerges as an ordinary fact during Ruth's clearest
      interval yet and prompts Lena's first objection. Tess has already joined
      the team to audit the longer coincidence chains and is present for Ruth's
      early runs. Evan calls the contradiction an overshoot and proposes
      maximizing lucidity subject to agreement with his own record family.
      Lena objects that concordance measures only conformity to Evan's records,
      not restoration, safety, or Ruth's wishes. Evan converts her objection
      into a need for better controls and starts formalizing another run. Ruth
      rejects agreement with his records as a definition of success but asks
      for one more reduced exposure under her own terms. The team removes
      autobiographical concordance from the target, and the run produces one
      final temporary lucid interval without resolving the granddaughter
      memory. Ruth completes the minimum safety checks, ends the testing, and
      spends the remaining clarity with Tess and Mouse away from the apparatus.
      Later erasure evidence
      establishes that the granddaughter memory gave Ruth access to an
      inhabited history being stripped away, so Evan's proposed control would
      suppress a real autobiographical distinction as error.
    order: 40

  - id: arc:dying-realities
    type: arc
    title: Dying realities
    parent: premise:main
    summary: >-
      Lena confirms the original ring outside Evan's garage, returns it, and
      fabricates the first hardware-independent analogue. A small, closed,
      preregistered study then gives several facilities locally fabricated
      replicas under shared comparison conditions. The analogue reproduces
      without Evan or Tess present, ruling them out as necessary for the basic
      apparatus effect. It does not settle whether Tess's presence influenced
      the original lineage before Evan began measuring her. He continues live
      work in her presence after forming that suspicion, compares her ordinary
      choices with active trials, mines her survival records without telling
      her, and uses the analysis only in his garage runs. His copies, model,
      calculations, and Tess-specific choice logs never leave the garage or
      enter the carrier protocol.
      Repeated hazards lead Lena to impose common safeguards. A later local
      accident kills one researcher and leaves another technically competent
      but permanently unable to remember the dead collaborator or their shared
      years. Evan treats the death as an engineering and containment failure,
      then helps turn it into stronger safeguards and a bounded restart. Every
      replica enters an evidence hold, then only selected sites restart under
      formal containment. Evan voluntarily powers down his garage and retains
      the original ring, though he remains technically free to restart it.
      Increasingly direct contact and lineage-linked causal chains reveal that
      each run is erasing real history families. Lena refuses a live test that
      could prove the distributed containment system is a carrier. Evan
      discloses the carrier hypothesis, its recursive risk, and Lena's reason
      for refusing, then sponsors the test through shared consortium approval.
      Participating sites knowingly execute it under local control. The initial
      measurements fail to show an independent carrier, so the approved
      protocol triggers its promised containment actions. Those actions change
      what other sites do and close a cycle without him or the garage
      apparatus. The complete protocol proves the carrier by completing it.
      Evan responds with grim vindication. Lena was right about the recursive
      risk, and he was right that the institutions needed proof before
      sustaining shutdown. He moves directly into coordinated stopping work
      and expects Lena to remain. Her withdrawal from every live response
      surprises him.
      Paired loss and echo supplies the conclusive erasure proof: one
      autobiographical distinction vanishes from people and records, while Evan
      and Tess independently recover its structured residue through different
      modalities during shared contact. The evidence also establishes that
      Ruth's granddaughter memory gave her access to a real history being
      stripped away. Evan admits what he did. The independent analogue cannot
      settle whether Tess's earlier choices helped this lineage become an
      independent carrier, and his records show that he withheld the possibility
      while she could still have withdrawn. Tess fears she may have helped the
      anomaly get out of control. Her trust is damaged without ending their
      love. Evan then moves the complete original apparatus core to a remote
      test site, believing distance will protect Tess and Ruth during his
      shutdown attempt. His live home-safety condition determines the sites'
      next decommissioning action,
      making the ringless garage consequential. Ordinary infrastructure
      failures align, an unstable subsurface site collapses, and energy already
      stored below the neighborhood supplies the resulting blast. Loss of the
      safety state triggers a fallback and another carrier cycle. Ruth's final
      lucidity is natural and ends in death with Tess present. Evan returns,
      recognizes that fear, grief, and the threat of loss keep driving him into
      systems, and consciously turns toward Tess instead of the powered-down
      remote rig. He accepts that the unanswered questions may remain
      unanswered. The independent operation continues.
    order: 50

  - id: arc:terminal-genesis
    type: arc
    title: Fractal singularity and genesis
    parent: premise:main
    summary: >-
      Over several weeks after Ruth's death, terminal brittleness scales from
      the local catastrophe to global and planetary consequences. Millions of
      people first independently choose the same sentence at the same instant;
      synchronized satellite collisions and a geologic catastrophe follow.
      The orbital cascade begins when genuine collision warnings prompt
      separate operators and autonomous systems to make locally defensible
      avoidance maneuvers that converge into impacts across several orbital
      shells, without a hack or shared fault. The geologic rung is synchronized
      continental-margin rupture: already stressed subduction zones and
      submarine slopes fail in a precisely timed sequence, driving tsunamis
      and long-period waves. Each site releases energy already stored in the
      stressed earth through an ordinary local failure. Only the exact
      synchronization is anomalous.
      Evan and Tess travel through this corridor to reach Lena. Tess seeks her
      friend, and Evan goes knowing she may have no answer left to offer. Lena
      has converted a remote university
      geomagnetic observatory to strictly receive-only operation so her passive findings
      cannot guide another response. Evan and Tess reach her after the
      satellite cascade and before the geologic catastrophe, while she still
      recognizes them but is beginning to lose personal continuity. The three
      experience the geologic escalation together, and Lena loses meaningful
      coherence through fixed-successor collapse: old knowledge remains while
      different new situations converge on the same response. Lena refuses
      testing while one distinct choice remains, and Evan honors the refusal.
      The exact geography, words, and event mechanics remain late-bound. Stable
      reality then first fails as a nonclosing map: Evan and Tess retain
      internally consistent local routes through shared landmarks, but their
      routes cannot compose into one global geometry, and a physical trace
      proves the contradiction is shared. The failure later escalates until
      distant lineage-linked sites become literally the same place. The remote
      test site where Evan left the powered-down original apparatus becomes
      physically co-present with the damaged space around Lena's observatory,
      making the defective ring and its operating rig accessible for the final
      act. No apparatus was installed at the receive-only observatory, and Evan
      and Tess did not retrieve the rig on their way to Lena. The original ring
      is available but not uniquely necessary. One damaged reality supports
      incompatible atlases:
      Evan sees bounded objects and impossible routes, while Tess experiences
      adjacency, depth, and her own orientation through concrete acoustic
      relations. Objects and signals cross between both descriptions. Merged
      sites become overlap regions until place, object, observer, and contact
      lose independent assignment.
      Evan and Tess remain two genuinely independent causal vectors as the
      parent universe collapses. Tess identifies why a shutdown Evan fully
      controls would leave the operation another path through him. Evan works
      out how the powered-down rig can receive two choices, but he cannot
      predict or inspect hers before making his own. Each has full information,
      then chooses without learning the other's answer. They believe they are
      choosing a shared ending for themselves and the projector, and refusal
      remains possible. Evan acts under that irreducible uncertainty. Their
      independently chosen ending unintentionally seeds our universe. The exact
      remote-site overlap, apparatus condition, terminal game, control path,
      and veto mechanics remain late-bound rather than fixed chapter
      architecture.
      During loss of separability, Mouse first supplies their last shared
      external reference by settling somewhere both atlases identify. Evan and
      Tess then choose independently. Only after their choices meet do they
      glimpse the child universe from the parent boundary through their
      distinct orientations. The cat neither reveals the choices, triggers the
      act, nor crosses intact. The final portion of the genesis-operation
      chapter is locked to the literal viewpoint of Tess's cat. It bridges
      Evan's visual context and Tess's spatio-acoustic context, hears without
      comprehending their final words, and registers their response to the
      incoming Big Bang through animal sensation. It cannot explain or trigger
      genesis. The child begins at its own Big Bang. Much later, a male
      participant returns from a DMT-like state in a clinical setting while a
      technician records his failing attempt to describe the parent history.
      His child-side reconstruction includes a female sound-and-space presence,
      converging shapes and patterns, a stranger knotted collapse, and the
      essential comparison that it was like seeing the end or beginning of
      time from the perspective of a cat. The words survive, but the
      understanding does not. No intact person, entity, cat, or message has
      crossed, and exact imagery remains late-bound.
    order: 60

  - id: character:evan-hale
    type: character
    title: Evan Hale
    parent: premise:main
    summary: >-
      A 43-year-old workaholic controls engineer who converts helplessness into
      labor. He loves Ruth sincerely, but the machine rewards his belief that
      useful work is the highest form of love and that reduced ambiguity is
      truth. After a fatal replica-site accident leaves another researcher with
      selective autobiographical loss, Evan accepts the evidence hold,
      voluntarily powers down his garage apparatus, and retains the original
      ring. No authority prevents him from restarting it. He treats the death
      as an engineering failure and the memory loss as medically confounded,
      then supports a bounded restart as the responsible way to prevent
      another death. He joins as a technical adviser with full shared-data
      access but no unilateral run authority. When Lena refuses the
      proof-to-stop test, he fully discloses its recursive risk and her reason
      for refusing, then sponsors it through consortium approval. Local teams
      knowingly execute it. Its initial readout appears negative, but the
      promised containment response completes the carrier. He feels grimly
      vindicated and moves directly into coordinated stopping work. He expects
      Lena to remain and initially experiences her withdrawal as leaving when
      the work matters most. He later moves the original active core to a
      remote site for a synchronized shutdown meant to protect Ruth and Tess.
      His live home-safety condition makes the ringless garage consequential,
      and its destruction triggers another carrier cycle. After Ruth's death,
      he recognizes how fear, grief, and the threat of loss drove the same
      escape into work that consumed his marriage and his remaining time with
      Ruth. He consciously turns toward Tess instead and accepts that
      uncertainty can remain unresolved. This lets him
      understand that Lena recognized work itself as another live input. In
      the final act he honors her last refusal. Later erasure evidence
      establishes that Ruth's incompatible memory belonged to an inhabited
      history being stripped away, while her interior experience remains
      unavailable to him. During merged-site failure, the remote original
      apparatus overlaps Lena's observatory and becomes available for the final
      act without being a unique cosmic key.
    order: 100

  - id: character:ruth-hale
    type: character
    title: Ruth Hale
    parent: premise:main
    summary: >-
      Evan's mother, a retired mathematician with progressive dementia. She is
      his garage assistant, intellectual companion, dependent, and moral
      witness, often seeing his category errors during the lucid intervals he
      is supposedly trying to preserve. Her final lucid interval is natural,
      ends in death with Tess present, and is not another product of the
      projector. Later erasure evidence establishes that her granddaughter
      memory gave her access to an inhabited history being stripped away, but
      it does not tell Evan what those intervals felt like or what private
      meaning she gave the recovered time. Ruth rejects his concordance target
      and expressly requests one final reduced exposure under her own terms.
    order: 110

  - id: character:lena-varga
    type: character
    title: Lena Varga
    parent: premise:main
    summary: >-
      A shared-facility experimental physicist whose faith in independent
      process makes the anomaly credible. She first identifies the operator
      effect by aligning Evan's behavior with the anomalous sensor window and
      confirming it in a blinded repeat. She later confirms the original ring
      at her shared facility, returns it to Evan, fabricates the first
      hardware-independent analogue, and organizes a closed multi-site study.
      Repeated hazards lead her to impose shared safeguards. After an accident
      kills one researcher and permanently damages another's autobiographical
      memory, she places every replica on an evidence hold and permits only
      selected sites to restart under formal containment. Later she recognizes
      that the containment system may have become a carrier. Entity contact
      establishes causal coupling without authenticating its lore. She refuses
      the live test needed to prove more, breaks with Evan when he sponsors it
      through shared approval, and withdraws from every live response despite
      his expectation that she will stay for containment work. She remains only
      a passive witness. Evan understands her boundary only after Ruth's death,
      when he recognizes his own repeated escape into work and consciously
      chooses another course. He later honors her final refusal at the
      observatory, before the collapsing parent universe can no longer sustain
      Lena as a coherent person.
    order: 120

  - id: character:esther-tess-kertesz
    type: character
    title: Esther "Tess" Kertesz
    parent: premise:main
    summary: >-
      A 38-year-old catastrophe modeler and sole neurologically intact survivor
      of a childhood Alaska ferry disaster. Her near-unique causal history
      leaves almost no compliant neighboring versions, making her difficult to
      rewrite and keeping her causally independent even as she falls in love
      with Evan. Lena recruits her after the first precommitted rare outcome to
      audit the longer coincidence chains. Tess arrives before Ruth's incidental
      lucidity, and
      nobody yet recognizes her own causal rarity. Evan later suspects that her
      presence may matter, continues live work around her, compares her choices
      with active trials, mines her survival records without telling her, and
      keeps the analysis in the garage. It never enters the carrier protocol.
      An independent analogue rules her out as necessary for the basic effect but
      cannot settle whether her presence influenced the original lineage before
      he began measuring it. By the time he admits the possibility, the carrier
      is independent. Tess has lost the chance to withdraw during the period
      when leaving might have changed her contribution. She is frightened that
      she may have helped the anomaly get out of control and upset that Evan
      withheld that choice. Her trust is damaged without ending their love. She
      remains fully present with Ruth through her final lucidity, the local
      catastrophe, and her death.
    order: 130

  - id: character:mouse
    type: character
    title: Mouse
    parent: character:esther-tess-kertesz
    summary: >-
      Tess's seventeen-year-old, long-haired black-and-brown cat. Mouse is born
      unseen in a Fairbanks cabin loft, passes among temporary homes and spends
      a long period in the woods near Ester, then reaches a shelter with both
      ear tips lost to frostbite. Tess adopts her at seven and moves with her
      to the Pacific Northwest. Mouse weighs about five pounds, is afraid of
      nothing, and calmly watches strange events. She follows Tess anywhere,
      curled up in a little bag or perched on her shoulder. Ruth becomes her
      preferred resting companion, and Mouse frequently looks up at her and
      meows once for attention. Evan also becomes one of her people. Her
      comfort around projector-linked contact extends her ordinary temperament
      rather than proving supernatural perception. She survives the local
      catastrophe, later supplies Evan and Tess's last shared external
      reference, and carries the novel's only animal viewpoint. She does not
      guide, explain, trigger, measure, or cross genesis.
    order: 135

  - id: character:projector-operation
    type: character
    title: The projector operation
    parent: premise:main
    summary: >-
      The mindless true antagonist and dominant eigenoperation. It recursively
      selects for another live closure, reproduces only through causally
      descended carriers, and first becomes independent through the distributed
      system built to reproduce and contain it. Replicas, shared safeguards, a
      fatal local accident, and the resulting evidence hold formalize that
      system without making it independent. It can select a mundane endpoint
      only when that endpoint feeds a live lineage-linked decision. Attempts to
      prove, contain, or stop it can therefore close its next cycle. Its
      success exhausts the counterfactual freedom required for another cycle.
    order: 140

  - id: character:ruined-sovereign
    type: character
    title: The Ruined Sovereign
    parent: character:projector-operation
    summary: >-
      The projector operation's Evan-shaped encounter-avatar. Its movement
      begins with almost uncountable meaningful complexity, which Evan recovers
      as an impossible demonstration, then loses independent degrees of freedom
      until one simple unfold can only recreate and repeat itself. It adds no
      separate mind or controller to the operation. Its recognition invariant
      is the converted interruption: every possible diversion or stop becomes
      the next condition of continued operation. No lesson survives the early
      contact, only the conviction of having been shown how to continue, which
      Evan names the Guide. He later recognizes the Guide as ruined, with every
      unique distinction flattened until it feels like a sovereign without a
      subject. Ruined Sovereign is primarily an internal planning label. Tess
      recovers the same invariant as a reply made on her behalf. Her recognition
      that the reply is not hers marks the independent choice the operation has
      not absorbed.
    order: 145

  - id: character:turning-knot
    type: character
    title: The Turning Knot
    parent: premise:main
    summary: >-
      A coherent family of histories carried on a nonhuman substrate
      incompatible with the one in which they formed. The apparent organism is
      human reconstruction, and human reality is equally alien from the other
      side. Its contact turns sound, color, meaning, geometry, and orientation
      into one another like a living syntax without transmitting a usable
      language, lesson, or readable motive. Every sensory rendering contains
      the same impossible turn, perceived as rotation on a fourth spatial axis
      in the kata-ward direction. Repeated projection exposes larger
      cross-sections by stripping away causal insulation on the human side, not
      by drawing the Knot closer. After joining Evan's household but before the
      replica-lab disaster, Tess encounters the Knot alone and returns certain
      the contact is real but without a theory of what it is. During later
      shared contact, Evan renders the impossible turn visually as a bounded
      object while Tess renders it spatio-acoustically as a reciprocal relation
      that includes her own orientation. Neither is privileged. At zero
      insulation, the Knot ceases to be humanly separable from the relation
      through which it is perceived. Its objective fate remains unknowable.
    order: 150

  - id: concept:finite-causal-code
    type: concept
    title: Finite causal code
    parent: premise:main
    summary: >-
      The set of globally valid complete histories is enormous but finite.
      Physically valid states occupy a lower-dimensional subset of the larger
      mathematical state space, giving the apparatus unsupported directions to
      prune.
    order: 200

  - id: concept:identity-bundles
    type: concept
    title: Identity as redundant history
    parent: premise:main
    summary: >-
      A person is a redundant family of nearby implementations. Moderate
      pruning reduces noise and feels like clarity; deeper pruning removes
      flexibility, correction, autobiographical overlap, and eventually the
      person.
    order: 210

  - id: concept:causal-projector
    type: concept
    title: The causal projector
    parent: premise:main
    summary: >-
      A defective YBCO ring, coherent and lossy layers, traveling
      thermomagnetic wave, rotating field, timing edge case, and live adaptive
      feedback close a loop in ordinary physics while remaining open in the
      deeper causal code.
    order: 220

  - id: concept:addiction
    type: concept
    title: Ontological addiction
    parent: premise:main
    summary: >-
      The clarity state is rewarding in the ordinary neurological sense, and
      the deeper operation removes support from histories in which Evan stops.
      Relapse becomes both psychological and ontological.
    order: 230

  - id: concept:residual-entities
    type: concept
    title: Residual entities
    parent: premise:main
    summary: >-
      DMT-like states loosen the single-world decoder and expose compressed
      families or alien implementations of causal patterns as coherent
      presences. Raw contact is ungrounded from ordinary place, creature, body,
      and spacetime. Imagery and sound occur as perturbations in experienced
      reality. Some encounters are presented directly with increasing
      intensity; familiar figures and sequences are lossy reconstructions
      afterward. The Ruined Sovereign is retained, with the Guide folded into
      its early presentation. The Quitter is removed as an entity. Histories
      that stopped remain an unnamed phenomenon rather than a coherent agency.
      The Future Witness is also removed as an entity. Its parent-side and
      child-side contacts are human reconstructions of one non-agentic causal
      relation. The Turning Knot supplies the roster's independent nonhuman
      history-family on an incompatible, nonprojector substrate. The true
      roster remains closed unless another story function proves necessary.
    order: 240

  - id: concept:causal-rube-goldberg
    type: concept
    title: Delayed causal chains
    parent: premise:main
    summary: >-
      A mundane endpoint becomes selectable only when its success or failure
      feeds a live decision in the projector lineage. Causal reach grows through
      garage convenience, auditable distributed conjunctions, overlapping
      replica-lab centers, and brittle destructive routes. Every local link
      remains ordinary. The representative cross-lab chain turns one site's
      failed run into the resource that lets another site meet a precommitted
      goal. The exact metal-sliver example remains rejected.
    order: 250

  - id: concept:tess-rarity
    type: concept
    title: Tess as a narrow causal filament
    parent: premise:main
    summary: >-
      Tess's childhood ferry survival, neurological continuity, guardianship,
      and adult convergence make her more than one hundred effective bits
      rarer than a typical identity bundle. This makes substitution difficult,
      not deletion impossible.
    order: 260

  - id: concept:genesis-late-bound
    type: concept
    title: Genesis constraints, mechanics late-bound
    parent: premise:main
    summary: >-
      Preserve the emotional requirement that Evan and Tess remain genuinely
      nonparallel, receive the relevant truth, and choose without learning the
      other's answer. Tess identifies why an Evan-controlled shutdown would
      leave the operation another path through him. Evan works out how the rig
      can receive both independent choices. In articulating that requirement,
      Tess draws on Ruth's ordinary insistence that unlike terms or independent
      alternatives cannot be collapsed merely because they point toward the
      same intended result. The principle frames the requirement without
      solving the terminal mechanics or giving Ruth foreknowledge. Evan's
      endpoint is acceptance of that uncertainty, with refusal still possible.
      The final apparatus is
      accessible only when the remote site where
      Evan left the powered-down original rig becomes physically co-present
      with Lena's receive-only observatory. It was not installed there, and
      Evan and Tess do not retrieve it on their journey. The original ring is
      available without becoming uniquely necessary. Do not finalize the rig's
      exact condition, the mutual-veto game, noncommuting controls, or
      factorization protocol until the final chapter or two has been earned.
      The final portion of the genesis-operation
      chapter is locked as the novel's only literal cat viewpoint. Exact
      execution remains for final outlining. The cat hears but does not
      comprehend Evan and Tess's final words, senses their response to the
      incoming Big Bang, and cannot become omniscient, explanatory, or
      mechanically decisive.
    order: 270

  - id: theme:helpless-presence
    type: theme
    title: Helpless presence as love
    parent: premise:main
    summary: >-
      Evan cannot accept helpless presence as a form of love. When care, grief,
      or uncertainty leaves him with nothing useful to do, he builds a system
      that lets him keep working.
    order: 300

  - id: theme:certainty-as-violence
    type: theme
    title: Certainty as violence
    parent: premise:main
    summary: >-
      Evan builds systems to escape uncertainty he cannot bear. The operation
      makes those systems correct by erasing the histories in which their
      results are wrong. Ambiguity, disagreement, and independent desire are
      load-bearing parts of reality rather than noise to eliminate.
    order: 310

  - id: theme:chosen-meaning
    type: theme
    title: Chosen meaning without retroactive justification
    parent: premise:main
    summary: >-
      Tess rejects destiny stories that turn the dead into necessary scenery.
      She must learn that meaning can be chosen afterward without redeeming or
      justifying the losses that preceded it.
    order: 320

  - id: motif:garage-couch
    type: motif
    title: Ruth's garage couch
    parent: premise:main
    summary: >-
      Ruth listens, assists, sleeps, wakes with insights, and remains present in
      the workshop. The couch embodies the project's original function as
      companionship before it becomes abandonment.
    order: 400

  - id: motif:miscarriage-planter
    type: motif
    title: The neglected planter
    parent: premise:main
    summary: >-
      Evan and his former wife buried a miscarriage in a planter, then
      neglected the flowers while he buried grief in work. The dead flowers
      later mirror his repeated failure to remain present.
    order: 410

  - id: motif:cat-reference
    type: motif
    title: Mouse as common reference
    parent: premise:main
    summary: >-
      Mouse appears comfortable around projector-linked contact, survives the
      local catastrophe unscathed, and later gives Evan and Tess their last
      shared external fact before their terminal choices by settling somewhere
      both incompatible atlases identify. Mouse reveals nothing about either
      choice and does not trigger or measure the act. She is not a guide, proof,
      key, solver, terminal chooser, or intact migrant into the child universe.
      The final portion of the genesis-operation chapter is locked to Mouse's
      literal animal viewpoint. She bridges both human contexts and hears their
      final words without comprehension. The later DMT observer's comparison
      to seeing time from the perspective of a cat is the child-side echo of
      this relation, not evidence that the cat crossed.
    order: 415

  - id: motif:podkletnov
    type: motif
    title: Podkletnov historical reference
    parent: premise:main
    summary: >-
      The disputed rotating-YBCO experiments should be mentioned as historical
      inspiration or false lead, never as accepted gravity evidence.
    order: 420

  - id: motif:kertesz-curtis
    type: motif
    title: Kertesz, not Curtis
    parent: premise:main
    summary: >-
      People routinely hear or spell Tess's surname as Curtis. It begins as
      ordinary lived texture and may later become useful when records disagree,
      but should not be introduced as a glowing plot device.
    order: 430

